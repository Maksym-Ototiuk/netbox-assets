[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-assets"
version = "1.0.0"
authors = [
    { name = "Maksym Ototiuk", email = "pypi@masik.slmail.me" },
]
description = "Simple asset tracking for NetBox. A stripped-down fork of netbox-inventory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["netbox", "netbox-plugin", "assets", "inventory"]

[project.urls]
Homepage = "https://github.com/Maksym-Ototiuk/netbox-assets"
Issues = "https://github.com/Maksym-Ototiuk/netbox-assets/issues"
Upstream = "https://github.com/ArnesSI/netbox-inventory"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_assets*"]

[tool.ruff]
exclude = [
    "netbox_assets/migrations",
]

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "W", "C", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-local-folder = ["netbox_assets"]
known-first-party = [
    "netbox",
    "core",
    "dcim",
    "extras",
    "tenancy",
    "users",
    "utilities",
]

[tool.ruff.format]
quote-style = "single"
